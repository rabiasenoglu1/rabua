<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Olay günlüğü: eğitim ve topluluk yolculuğu">
  <defs>
    <style>
      .mono{font-family:Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI',Arial,sans-serif}
      .ts{font-size:14px;fill:#5ad1e6}
      .ev{font-size:16px;fill:#e8eef8}
      .lv{font-size:12px;fill:#f5a524;letter-spacing:1px}
      @keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
      .row{animation:in .6s ease-out both}
      .r1{animation-delay:.1s}.r2{animation-delay:.35s}.r3{animation-delay:.6s}.r4{animation-delay:.85s}.r5{animation-delay:1.1s}.r6{animation-delay:1.35s}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      .live{animation:pulse 1.6s ease-in-out infinite}
    </style>
  </defs>
  <rect width="900" height="300" rx="16" fill="#0b1220"/>
  <rect x=".5" y=".5" width="899" height="299" rx="16" fill="none" stroke="#2a3a5c"/>
  <path d="M0 16a16 16 0 0 1 16-16h868a16 16 0 0 1 16 16v30H0z" fill="#16213a"/>
  <text x="28" y="29" class="mono" font-size="13" fill="#9fb0cc">olay_gunlugu.log</text>
  <text x="872" y="29" text-anchor="end" class="mono" font-size="12" fill="#f5a524">● KAYIT SÜRÜYOR</text>

  <!-- timeline spine -->
  <line x1="128" y1="70" x2="128" y2="276" stroke="#2a3a5c" stroke-width="2"/>

  <g class="row r1"><circle cx="128" cy="80" r="6" fill="#5ad1e6"/>
    <text x="40" y="85" class="ts mono">2023</text>
    <text x="150" y="85" class="ev sans">Fırat Üniversitesi · Adli Bilişim Mühendisliği başladı</text></g>

  <g class="row r2"><circle cx="128" cy="116" r="6" fill="#5ad1e6"/>
    <text x="40" y="121" class="ts mono">2023-10</text>
    <text x="150" y="121" class="ev sans">Adli Bilişim Topluluğu · Tasarım Sorumlusu &amp; Üye</text></g>

  <g class="row r3"><circle cx="128" cy="152" r="6" fill="#5ad1e6"/>
    <text x="40" y="157" class="ts mono">2024-11</text>
    <text x="150" y="157" class="ev sans">Teknoloji Topluluğu · Sosyal Medya</text>
    <text x="520" y="157" class="lv mono">→ 2025-02</text></g>

  <g class="row r4"><circle cx="128" cy="188" r="6" fill="#5ad1e6"/>
    <text x="40" y="193" class="ts mono">2026-02</text>
    <text x="150" y="193" class="ev sans">Siber Güvenlik Topluluğu · Sosyal Medya Editörü</text></g>

  <g class="row r5"><circle cx="128" cy="224" r="6" fill="#f5a524" class="live"/>
    <text x="40" y="229" class="ts mono">ŞİMDİ</text>
    <text x="150" y="229" class="ev sans">Wireshark, Autopsy ve Python ile pratik yapıyor</text></g>

  <g class="row r6"><circle cx="128" cy="260" r="6" fill="none" stroke="#6b7a96" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="40" y="265" class="ts mono" fill="#6b7a96" style="fill:#6b7a96">2027</text>
    <text x="150" y="265" class="ev sans" style="fill:#9fb0cc">Mezuniyet (hedef)</text></g>
</svg>
